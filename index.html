<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Buttons</title>
  <style>
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    #button-container {
      display: flex;

 
      gap: 12px;

      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      overflow-x: auto;
      width: 1400px;
      height: 3cm;
      scrollbar-width: thin;
      scrollbar-color: blueviolet transparent;
    }

    #button-container::-webkit-scrollbar {
      height: 3cm;
      width:1024px;
    }

    #button-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #button-container::-webkit-scrollbar-thumb {
      background-color: red;
      border-radius: 10px;
    }

    button {

      padding: 12px 20px;
      border: 2px solid transparent;
      border-radius: 8px;
      background-color: blueviolet;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
      box-sizing: border-box;
      height:3cm;
      width: 150px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    button.active {
      border-color: white;
      box-shadow: 0 0 14px currentColor;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div id="button-container">
  <button data-color="rgb(205, 92, 92)"   onclick="handleClick(this)">Btn 0</button>
  <button data-color="rgb(250, 128, 114)" onclick="handleClick(this)">Btn 1</button>
  <button data-color="rgb(255, 160, 122)" onclick="handleClick(this)">Btn 2</button>
  <button data-color="rgb(255, 192, 203)" onclick="handleClick(this)">Btn 3</button>
  <button data-color="rgb(255, 105, 180)" onclick="handleClick(this)">Btn 4</button>
  <button data-color="rgb(219, 112, 147)" onclick="handleClick(this)">Btn 5</button>
  <button data-color="rgb(255, 160, 122)" onclick="handleClick(this)">Btn 6</button>
  <button data-color="rgb(255, 127, 80)"  onclick="handleClick(this)">Btn 7</button>
  <button data-color="rgb(255, 140, 0)"   onclick="handleClick(this)">Btn 8</button>
  <button data-color="rgb(255, 165, 0)"   onclick="handleClick(this)">Btn 9</button>
  <button data-color="rgb(255, 215, 0)"   onclick="handleClick(this)">Btn 10</button>
  <button data-color="rgb(255, 228, 181)" onclick="handleClick(this)">Btn 11</button>
  <button data-color="rgb(189, 183, 107)" onclick="handleClick(this)">Btn 12</button>
  <button data-color="rgb(230, 230, 250)" onclick="handleClick(this)">Btn 13</button>
  <button data-color="rgb(216, 191, 216)" onclick="handleClick(this)">Btn 14</button>
  <button data-color="rgb(147, 112, 219)" onclick="handleClick(this)">Btn 15</button>
</div>

<script>
  function handleClick(btn) {
    document.querySelectorAll('#button-container button').forEach(b => {
      b.classList.remove('active');
      b.style.backgroundColor = 'blueviolet';
    });
    btn.classList.add('active');
    btn.style.backgroundColor = btn.dataset.color;
    switchSheet([...btn.parentElement.children].indexOf(btn));
  }

  function switchSheet(index) {
    console.log("switchSheet called with index:", index);
  }
</script>

</body>
</html>
